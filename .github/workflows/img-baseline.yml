name: img-det-baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/img-baseline.yml"
      - "notebooks/**"

concurrency:
  group: img-det-baseline
  cancel-in-progress: false

jobs:
  payload-first-half:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aludam/pyproject.toml

      - name: system libs (cv2 safety net)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1 libglib2.0-0

      - name: install dependencies
        run: |
          python -m pip install -U pip -q
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "./aludam[neural]" pyarrow "fsspec[http]" \
            scikit-learn pandas requests aiohttp

      - name: start bund listen (query /status from Telegram during the run)
        env:
          BUND_TOKEN: ${{ secrets.BUND_TOKEN }}
          BUND_CHAT: ${{ secrets.BUND_CHAT }}
        run: |
          pip install -q bund || exit 0
          if [ -n "$BUND_TOKEN" ]; then bund set --token "$BUND_TOKEN" || true; fi
          if [ -n "$BUND_CHAT" ]; then bund set --chat "$BUND_CHAT" || true; fi
          nohup bund listen > /tmp/bund-listen.log 2>&1 &
          sleep 2
          echo "bund listen started (pid $!); log: /tmp/bund-listen.log"

      - name: restore HF weights cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-weights-ai-image-detector-v1

      - name: restore eval data cache
        uses: actions/cache/restore@v4
        with:
          path: aludam/eval/data/index
          key: eval-miss-${{ github.run_id }}
          restore-keys: |
            eval-

      - name: stage - index + select
        run: |
          if python -u notebooks/run_img_baseline.py index; then
            bund -m "img_det [job1] index+select OK" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job1] index+select FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint index
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-idx

      - name: stage - payload chunk 1/6 (rows 0-249)
        run: |
          if python -u notebooks/run_img_baseline.py payload 0:250; then
            bund -m "img_det [job1] chunk 1/6 OK (0-249)" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job1] chunk 1/6 FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint chunk 1
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-p1

      - name: stage - payload chunk 2/6 (rows 250-499)
        run: |
          if python -u notebooks/run_img_baseline.py payload 250:500; then
            bund -m "img_det [job1] chunk 2/6 OK (250-499)" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job1] chunk 2/6 FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint chunk 2
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-p2

      - name: stage - payload chunk 3/6 (rows 500-749)
        run: |
          if python -u notebooks/run_img_baseline.py payload 500:750; then
            bund -m "img_det [job1] chunk 3/6 OK (500-749)" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job1] chunk 3/6 FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint chunk 3
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-p3

      - name: notify on failure (bund)
        if: failure()
        env:
          BUND_TOKEN: ${{ secrets.BUND_TOKEN }}
          BUND_CHAT: ${{ secrets.BUND_CHAT }}
        run: |
          pip install -q bund || exit 0
          if [ -n "$BUND_TOKEN" ]; then bund set --token "$BUND_TOKEN" || true; fi
          if [ -n "$BUND_CHAT" ]; then bund set --chat "$BUND_CHAT" || true; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          bund -m "img_det baseline: job 1 (index + payload 0-749) FAILED. Re-run it. $RUN_URL" || true

  payload-and-result:
    needs: payload-first-half
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SCORE_ISOLATE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aludam/pyproject.toml

      - name: system libs (cv2 safety net)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1 libglib2.0-0

      - name: install dependencies
        run: |
          python -m pip install -U pip -q
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "./aludam[neural]" pyarrow "fsspec[http]" \
            scikit-learn pandas requests aiohttp

      - name: start bund listen (query /status from Telegram during the run)
        env:
          BUND_TOKEN: ${{ secrets.BUND_TOKEN }}
          BUND_CHAT: ${{ secrets.BUND_CHAT }}
        run: |
          pip install -q bund || exit 0
          if [ -n "$BUND_TOKEN" ]; then bund set --token "$BUND_TOKEN" || true; fi
          if [ -n "$BUND_CHAT" ]; then bund set --chat "$BUND_CHAT" || true; fi
          nohup bund listen > /tmp/bund-listen.log 2>&1 &
          sleep 2
          echo "bund listen started (pid $!); log: /tmp/bund-listen.log"

      - name: restore HF weights cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-weights-ai-image-detector-v1

      - name: restore eval data cache (job 1 checkpoints)
        uses: actions/cache/restore@v4
        with:
          path: aludam/eval/data/index
          key: eval-miss2-${{ github.run_id }}
          restore-keys: |
            eval-

      - name: stage - payload chunk 4/6 (rows 750-999)
        run: |
          if python -u notebooks/run_img_baseline.py payload 750:1000; then
            bund -m "img_det [job2] chunk 4/6 OK (750-999)" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job2] chunk 4/6 FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint chunk 4
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-p4

      - name: stage - payload chunk 5/6 (rows 1000-1249)
        run: |
          if python -u notebooks/run_img_baseline.py payload 1000:1250; then
            bund -m "img_det [job2] chunk 5/6 OK (1000-1249)" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job2] chunk 5/6 FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint chunk 5
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-p5

      - name: stage - payload chunk 6/6 (rows 1250-1499)
        run: |
          if python -u notebooks/run_img_baseline.py payload 1250:1500; then
            bund -m "img_det [job2] chunk 6/6 OK (1250-1499)" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job2] chunk 6/6 FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint chunk 6
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-p6

      - name: stage - payload sweep (rescue stragglers)
        run: |
          if python -u notebooks/run_img_baseline.py payload 0:1500; then
            bund -m "img_det [job2] sweep OK" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job2] sweep FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: stage - score chunk 1/6 (rows 0-249)
        run: |
          if python -u notebooks/run_img_baseline.py score 0:250; then
            bund -m "img_det [job2] score chunk 1/6 OK" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job2] score chunk 1/6 FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint score chunk 1/6
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-${{ github.run_attempt }}-s1

      - name: stage - score chunk 2/6 (rows 250-499)
        run: |
          if python -u notebooks/run_img_baseline.py score 250:500; then
            bund -m "img_det [job2] score chunk 2/6 OK" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job2] score chunk 2/6 FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint score chunk 2/6
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-${{ github.run_attempt }}-s2

      - name: stage - score chunk 3/6 (rows 500-749)
        run: |
          if python -u notebooks/run_img_baseline.py score 500:750; then
            bund -m "img_det [job2] score chunk 3/6 OK" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job2] score chunk 3/6 FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint score chunk 3/6
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-${{ github.run_attempt }}-s3

      - name: stage - score chunk 4/6 (rows 750-999)
        run: |
          if python -u notebooks/run_img_baseline.py score 750:1000; then
            bund -m "img_det [job2] score chunk 4/6 OK" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job2] score chunk 4/6 FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint score chunk 4/6
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-${{ github.run_attempt }}-s4

      - name: stage - score chunk 5/6 (rows 1000-1249)
        run: |
          if python -u notebooks/run_img_baseline.py score 1000:1250; then
            bund -m "img_det [job2] score chunk 5/6 OK" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job2] score chunk 5/6 FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint score chunk 5/6
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-${{ github.run_attempt }}-s5

      - name: stage - score chunk 6/6 (rows 1250-1499)
        run: |
          if python -u notebooks/run_img_baseline.py score 1250:1500; then
            bund -m "img_det [job2] score chunk 6/6 OK" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job2] score chunk 6/6 FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint score chunk 6/6
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-${{ github.run_attempt }}-s6

      - name: stage - score sweep (resume anything missed)
        run: |
          if python -u notebooks/run_img_baseline.py score ; then
            bund -m "img_det [job2] score sweep OK" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job2] score sweep FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: checkpoint score sweep
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-${{ github.run_attempt }}-score

      - name: score diagnostics (memory / OOM evidence)
        if: always()
        run: |
          free -m || true
          echo "--- kernel OOM / kill messages (if any) ---"
          sudo dmesg 2>/dev/null | grep -i -E "out of memory|killed process|oom" | tail -20 || true
          echo "--- score records: total / errors ---"
          f=aludam/eval/data/index/img_scores.jsonl
          if [ -f "$f" ]; then
            echo "total: $(wc -l < $f)  with error: $(grep -c '"error"' $f || true)"
            grep '"error": "worker_' $f | head -20 || true
          fi

      - name: stage - analyze + result.txt
        run: |
          if python -u notebooks/run_img_baseline.py analyze; then
            bund -m "img_det [job2] analyze OK - result.txt ready" || true
          else
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            bund -m "img_det [job2] analyze FAILED. $RUN_URL" || true
            exit 1
          fi

      - name: upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: img-baseline-${{ github.run_id }}
          path: |
            notebooks/result.txt
            aludam/eval/data/index/img_scores.jsonl
          if-no-files-found: ignore
          retention-days: 90

      - name: notify via bund (Telegram)
        if: always()
        env:
          BUND_TOKEN: ${{ secrets.BUND_TOKEN }}
          BUND_CHAT: ${{ secrets.BUND_CHAT }}
        run: |
          pip install -q bund || exit 0
          if [ -n "$BUND_TOKEN" ]; then bund set --token "$BUND_TOKEN" || true; fi
          if [ -n "$BUND_CHAT" ]; then bund set --chat "$BUND_CHAT" || true; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f notebooks/result.txt ]; then
            bund -m "img_det baseline DONE. result.txt is in the run's artifact. $RUN_URL" || true
          else
            bund -m "img_det baseline run ended WITHOUT result.txt (${{ job.status }}). Check: $RUN_URL" || true
          fi
