name: img-det-baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/img-baseline.yml"
      - "notebooks/**"

concurrency:
  group: img-det-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aludam/pyproject.toml

      - name: system libs (cv2 safety net)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1 libglib2.0-0

      - name: install dependencies
        run: |
          python -m pip install -U pip -q
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "./aludam[neural]" pyarrow "fsspec[http]" \
            scikit-learn pandas requests aiohttp

      - name: start bund listen (query /status from Telegram during the run)
        env:
          BUND_TOKEN: ${{ secrets.BUND_TOKEN }}
          BUND_CHAT: ${{ secrets.BUND_CHAT }}
        run: |
          pip install -q bund || exit 0
          if [ -n "$BUND_TOKEN" ]; then bund set --token "$BUND_TOKEN" || true; fi
          if [ -n "$BUND_CHAT" ]; then bund set --chat "$BUND_CHAT" || true; fi
          nohup bund listen > /tmp/bund-listen.log 2>&1 &
          sleep 2
          echo "bund listen started (pid $!); log: /tmp/bund-listen.log"
          cat /tmp/bund-listen.log || true

      - name: restore HF weights cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-weights-ai-image-detector-v1

      - name: restore eval data cache (index+payload+scores+state)
        uses: actions/cache/restore@v4
        with:
          path: aludam/eval/data/index
          key: eval-miss-${{ github.run_id }}
          restore-keys: |
            eval-

      - name: step 1 - index + select + payload download
        run: python -u notebooks/run_img_baseline.py payload

      - name: checkpoint payload
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-payload

      - name: step 2 - score
        run: python -u notebooks/run_img_baseline.py score

      - name: checkpoint scores
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aludam/eval/data/index
          key: eval-${{ github.run_id }}-score

      - name: step 3 - analyze + result.txt
        run: python -u notebooks/run_img_baseline.py analyze

      - name: upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: img-baseline-${{ github.run_id }}
          path: |
            notebooks/result.txt
            aludam/eval/data/index/img_scores.jsonl
          if-no-files-found: ignore
          retention-days: 90

      - name: notify via bund (Telegram)
        if: always()
        env:
          BUND_TOKEN: ${{ secrets.BUND_TOKEN }}
          BUND_CHAT: ${{ secrets.BUND_CHAT }}
        run: |
          pip install -q bund || exit 0
          if [ -n "$BUND_TOKEN" ]; then bund set --token "$BUND_TOKEN" || true; fi
          if [ -n "$BUND_CHAT" ]; then bund set --chat "$BUND_CHAT" || true; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f notebooks/result.txt ]; then
            bund -m "img_det baseline DONE. result.txt is in the run's artifact. $RUN_URL" || true
          else
            bund -m "img_det baseline run ended WITHOUT result.txt (${{ job.status }}). Check: $RUN_URL" || true
          fi
